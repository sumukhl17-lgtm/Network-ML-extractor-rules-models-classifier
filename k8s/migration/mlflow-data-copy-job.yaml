apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-data-copy
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-data-copy
    spec:
      restartPolicy: Never
      containers:
        - name: copy-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if [ -z "$(ls -A /source)" ]; then
                echo "Migration source is empty; stage a backup of mlflow/data first." >&2
                exit 1
              fi
              if [ ! -s /source/mlflow.db ] || [ ! -d /source/artifacts ]; then
                echo "Migration source must contain mlflow.db and artifacts/." >&2
                exit 1
              fi
              if [ -n "$(ls -A /destination)" ]; then
                echo "MLflow destination is not empty; refusing to overwrite it." >&2
                exit 1
              fi
              cp -a /source/. /destination/
              test -s /destination/mlflow.db
              test -d /destination/artifacts
              echo "MLflow database and artifact tree copied to the empty destination claim."
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: mlflow-migration-source
            readOnly: true
        - name: destination
          persistentVolumeClaim:
            claimName: mlflow-data
