apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Network ML
        orgId: 1
        folder: Network ML
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
  network-ml.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "sum by (path) (rate(app_http_requests_total[5m]))",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "title": "HTTP request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(app_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{path}} p95",
              "refId": "A"
            }
          ],
          "title": "Request latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 9},
          "id": 3,
          "targets": [
            {
              "expr": "sum by (path, status) (rate(app_http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "{{path}} {{status}}",
              "refId": "A"
            }
          ],
          "title": "HTTP server errors",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 9},
          "id": 4,
          "targets": [
            {
              "expr": "sum by (branch, source) (rate(app_classifications_total[5m]))",
              "legendFormat": "{{branch}} / {{source}}",
              "refId": "A"
            }
          ],
          "title": "Classification counts",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["network-ml", "classification"],
      "time": {"from": "now-6h", "to": "now"},
      "title": "Network & Document Classification",
      "uid": "network-ml-platform",
      "version": 1
    }
