apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: network-ml

resources:
  - namespace.yaml
  - configmap.yaml
  - backend/pvc.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/nginx-configmap.yaml
  - mlflow/pvc.yaml
  - mlflow/deployment.yaml
  - mlflow/service.yaml
  - tika/deployment.yaml
  - tika/service.yaml

images:
  - name: apache/tika
    newName: apache/tika
    newTag: latest
