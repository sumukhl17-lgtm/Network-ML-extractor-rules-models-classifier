apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tika
    spec:
      containers:
        - name: tika
          image: apache/tika:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9998
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
